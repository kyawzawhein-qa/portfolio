name: Deploy Next.js Portfolio

on:
  push:
    branches:
      - main
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set Target Environment
        id: set_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_DIR=/var/www/kyawzawhein.com" >> $GITHUB_ENV
            echo "PM2_NAME=portfolio-main" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "TARGET_DIR=/var/www/test.kyawzawhein.com" >> $GITHUB_ENV
            echo "PM2_NAME=portfolio-qa" >> $GITHUB_ENV
          fi

      - name: 🚀 Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ env.TARGET_DIR }}
          exclude: ".git/,.github/,node_modules/,.next/,test-results/,playwright-report/"

      - name: ⚙️ Build and Restart Next.js on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.TARGET_DIR }}
            if [ ! -f .env ]; then cp .env.example .env; fi
            mkdir -p public/uploads
            npm install
            npx prisma generate
            npx prisma db push
            node prisma/ensure-content.cjs
            npm run build
            pm2 restart ${{ env.PM2_NAME }} || pm2 start npm --name "${{ env.PM2_NAME }}" -- start
            pm2 save
